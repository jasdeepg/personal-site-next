name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Lint
        run: yarn lint
      - name: Type-check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build without CMS or database credentials
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check production routes and SEO output
        run: yarn smoke
